
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vanderlande Sensor Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <script src="js/app.js" defer></script>
</head>
<body>

    <!-- Navigatie -->
    <aside class="sidebar">
        <h2>Vanderlande</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#sensors">Sensoren</a>
            <a href="#configuration">Configuratie</a>
        </nav>
    </aside>

    <!-- Hoofdinhoud -->
    <main>
        <section id="home">
            <h1>Sensor Dashboard</h1>
            <p>Overzicht van het transportsysteem.</p>

            <div class="card">
                <h3>Systeemstatus</h3>
                <p id="systemStatus">Nog niet verbonden</p>
            </div>
        </section>

        <div class="sensor-camera-row">
            <section id="sensors" class="sensor-panel">
                <h2>Sensoren</h2>

                <div class="card">
                    <p>Hier komen later de sensorgegevens.</p>
                </div>
            </section>

            <section id="camera" class="camera-panel">
                <h2>Camera</h2>

                <div class="card">
                    <p>Hier komt een live cam</p>
                </div>
            </section>
        </div>

        <section id="configuration">
            <h2>Configuratie</h2>

            <div class="card">
                <p>Hier kunnen we later instellingen toevoegen.</p>
            </div>
        </section>
    </main>

</body>
</html>
